name: diag-logs
on:
  push:
    branches: ['diag/**']
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Query Workers Observability (serialis-web-staging, 18/11 20:30-21:15 UTC)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FROM=$(date -d '2026-11-18T20:30:00Z' +%s%3N); TO=$(date -d '2026-11-18T21:15:00Z' +%s%3N)
          BODY="{\"queryId\":\"diag-track-2\",\"timeframe\":{\"from\":$FROM,\"to\":$TO},\"view\":\"events\",\"limit\":200,\"parameters\":{\"filters\":[{\"key\":\"\$workers.scriptName\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"serialis-web-staging\"}]}}"
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/observability/telemetry/query" \
            -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' -d "$BODY" > out.json
          jq -r '.result.events.events | length' out.json | sed 's/^/::notice title=count::/'
          jq -r '.result.events.events[] | select((.source | tostring) | test("error|failed|Error|tracked|Track"; "i")) | {t: (.timestamp/1000|todate), path: .["$workers"].event.request.path, src: (.source|tostring|.[0:900])} | @json' out.json | head -40 | while read -r L; do echo "::notice title=log::$L"; done
