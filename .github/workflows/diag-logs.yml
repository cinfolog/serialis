name: diag-logs
on:
  push:
    branches: ['diag/**']
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Query Workers Observability (serialis-web-staging, 18/11 20:30-21:15 UTC)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FROM=$(date -d '2026-11-19T09:50:00Z' +%s%3N); TO=$(date -d '2026-11-19T10:45:00Z' +%s%3N)
          for F in '{"key":"$metadata.message","operation":"includes","type":"string","value":"webhook"}' '{"key":"$metadata.message","operation":"includes","type":"string","value":"hooks"}' '{"key":"$metadata.level","operation":"eq","type":"string","value":"error"}'; do
            BODY="{\"queryId\":\"diag-pv3\",\"timeframe\":{\"from\":$FROM,\"to\":$TO},\"view\":\"events\",\"limit\":60,\"parameters\":{\"filters\":[{\"key\":\"\$workers.scriptName\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"serialis-web-staging\"},$F]}}"
            curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/observability/telemetry/query" \
              -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' -d "$BODY" > out.json
            echo "::notice title=filter::$F -> $(jq -r '.result.events.events | length' out.json) $(jq -r '.errors|tostring' out.json)"
            jq -r '.result.events.events[]? | {t: (.timestamp/1000|todate), src: (.source|tostring|.[0:900])} | @json' out.json | grep -v "OPTIONS" | head -40 | while read -r L; do echo "::notice title=log::$L"; done
          done
