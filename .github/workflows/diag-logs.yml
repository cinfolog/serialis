name: diag-logs
on:
  push:
    branches: ['diag/**']
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Query Workers Observability (api.failed, 18/11 20:30-21:15 UTC)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FROM=$(date -d '2026-11-18T20:30:00Z' +%s%3N); TO=$(date -d '2026-11-18T21:15:00Z' +%s%3N)
          for BODY in \
            "{\"queryId\":\"diag-track\",\"timeframe\":{\"from\":$FROM,\"to\":$TO},\"view\":\"events\",\"limit\":100,\"parameters\":{\"filters\":[{\"key\":\"\$metadata.level\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"error\"}]}}" \
            "{\"queryId\":\"diag-track-all\",\"timeframe\":{\"from\":$FROM,\"to\":$TO},\"view\":\"events\",\"limit\":200}"; do
            curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/observability/telemetry/query" \
              -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' -d "$BODY" > out.json || true
            echo "::notice title=raw::$(head -c 1500 out.json | tr '\n' ' ')"
            jq -r '[.. | objects | select(has("$metadata")) | ."$metadata" | {t: .timestamp, lvl: .level, msg: (.message // "" | tostring | .[0:600]), err: (.error // "" | tostring | .[0:600]), svc: .service}] | map(select((.msg + .err) | test("api.failed|error|Error|tracked"))) | .[0:30][] | @json' out.json 2>/dev/null | while read -r L; do echo "::notice title=log::$L"; done || true
          done
